[package]
name = "opennetdeck-server"
version = "0.1.0"
edition = "2021"
authors = ["OpenNetDeck Contributors"]
description = "Linux daemon and server implementation of the Elgato Network Dock in Rust"
license = "MIT OR Apache-2.0"

[dependencies]
opennetdeck-protocol = { path = "../opennetdeck-protocol", features = ["std"] }
tokio = { version = "1.43", features = ["full"] }
bytes = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
nusb = { version = "0.2", features = ["tokio"] }
futures-util = "0.3"
mdns-sd = "0.21"
